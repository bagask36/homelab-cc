services:
  homelab-dashboard:
    container_name: homelab-dashboard
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
