services:
  homelab-dashboard:
    container_name: homelab-dashboard
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DOCKER_SOCKET: /var/run/docker.sock
      SERVICE_HOST: ${SERVICE_HOST:-host.docker.internal}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENWEBUI_URL: ${OPENWEBUI_URL:-http://host.docker.internal:8080}
      NPM_URL: ${NPM_URL:-http://host.docker.internal:81}
      CLOUDFLARE_TUNNEL_METRICS_URL: ${CLOUDFLARE_TUNNEL_METRICS_URL:-http://host.docker.internal:20241/metrics}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    # Root required to read the Docker socket on most hosts
    user: "0:0"
    restart: unless-stopped
