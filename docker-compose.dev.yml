services:
  postgres:
    container_name: homelab-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homelab}
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-homelab} -d ${POSTGRES_DB:-homelab}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    container_name: homelab-migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-homelab}:${POSTGRES_PASSWORD:-homelab}@postgres:5432/${POSTGRES_DB:-homelab}
    restart: "no"

  homelab-dashboard:
    container_name: homelab-dashboard
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${HOST_FS_SOURCE:-/}:${HOST_FS_ROOT:-/host}:ro,rslave
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-homelab}:${POSTGRES_PASSWORD:-homelab}@postgres:5432/${POSTGRES_DB:-homelab}
      AUTH_SECRET: ${AUTH_SECRET:-homelab-cc-dev-secret-change-me}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme}
      DOCKER_SOCKET: /var/run/docker.sock
      HOST_FS_ROOT: ${HOST_FS_ROOT:-/host}
      SERVICE_HOST: ${SERVICE_HOST:-172.17.0.1}
      POSTGRES_HOST: ${POSTGRES_HOST:-172.17.0.1}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-172.17.0.1}
      REDIS_PORT: ${REDIS_PORT:-6379}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://172.17.0.1:11434}
      OPENWEBUI_URL: ${OPENWEBUI_URL:-http://172.17.0.1:8080}
      NPM_URL: ${NPM_URL:-http://172.17.0.1:81}
      CLOUDFLARE_TUNNEL_METRICS_URL: ${CLOUDFLARE_TUNNEL_METRICS_URL:-http://172.17.0.1:20241/metrics}
    user: "0:0"
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
  postgres_data:
